↓VerifyIdToken [steps.SimpleStep-1790600000005]: 
  comment: Checks the id_token signature (Microsoft JWKS), issuer (lib_oauth.azuread.tenantid), audience (lib_oauth.azuread.clientid), validity dates and its at_hash binding to the access token
  expression: |
    'include("js/jwt_verify.js");
    // The id_token must be issued for lib_oauth.azuread.clientid by the configured tenant and bound to the access token (at_hash)
    var verification = libOAuthJwt.verifyAzureAdIdToken(id_token == null ? "" : String(id_token), access_token == null ? "" : String(access_token));
    id_token_verified = verification.ok;
    id_token_oid = verification.ok ? verification.claims.oid : null;
    if (!verification.ok) {
    	log.warn("(lib_OAuth.loginAzureAdWithAccessToken) id_token rejected: " + verification.error);
    }
    '
