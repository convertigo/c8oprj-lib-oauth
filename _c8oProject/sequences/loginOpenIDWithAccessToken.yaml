  ↓KeepGroupsInSession [steps.SimpleStep-1799700000005]: 
    comment: The groups and the authenticated user they belong to, kept on the server in the session key oAuthOpenIDGroups for the application (C8Oforms reads it in LoginOpenID); the key is removed when the claim is not configured
    expression: |
      'if (openIdGroups.enabled) {
      	context.httpSession.setAttribute("oAuthOpenIDGroups", JSON.stringify({
      		user: String(context.getAuthenticatedUser()),
      		claim: openIdGroups.claim,
      		state: openIdGroups.state,
      		groups: openIdGroups.groups,
      		source: openIdGroups.source,
      		at: new Date().getTime()
      	}));
      } else {
      	context.httpSession.removeAttribute("oAuthOpenIDGroups");
      }'
