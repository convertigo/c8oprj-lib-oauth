  ↓DecodeJWT [steps.SimpleStep-1693388427862]: 
    comment: Verifies the introspection response and the access token (or the id_token for Microsoft) before any claim is used (see js/jwt_verify.js)
    expression: |
      'include("js/jwt_verify.js");
      // The introspection response is authoritative (active, sub, exp, iss, audience). A JWT access token is also
      // verified (issuer JWKS, iss, audience, dates); for a Microsoft Graph access token, which only Microsoft can
      // verify, the id_token sent with it is verified instead. Only verified claims are used.
      var verification = libOAuthJwt.verifyOpenIdLogin(
      	access_token == null ? "" : String(access_token),
      	typeof introspection_response === "undefined" ? null : introspection_response,
      	id_token == null ? "" : String(id_token));
      access_token_verified = verification.ok;
      jsonJWT = verification.ok ? verification.claims : {};
      if (!verification.ok) {
      	log.warn("(lib_OAuth.loginOpenIDWithAccessToken) access token rejected: " + verification.error);
      } else {
      	log.debug("(lib_OAuth.loginOpenIDWithAccessToken) access token accepted, claims from: " + verification.mode);
      }
      '
